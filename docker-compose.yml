services:
  sive-db:
    image: postgres:16-alpine
    container_name: sive_postgres
    restart: always
    environment:
      POSTGRES_DB: sive_db
      POSTGRES_USER: sive_user
      POSTGRES_PASSWORD: sive_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:

