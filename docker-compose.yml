services:
  sive-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sive_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://sive-db:5432/sive_db
      - DB_USER=sive_user
      - DB_PASSWORD=sive_password
      - PORT=8080
    depends_on:
      sive-db:
        condition: service_healthy

  sive-db:
    image: postgres:16-alpine
    container_name: sive_postgres
    restart: always
    environment:
      POSTGRES_DB: sive_db
      POSTGRES_USER: sive_user
      POSTGRES_PASSWORD: sive_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sive_user -d sive_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:


