# ==============================================================================
# fly.toml - Configuracao de Deploy no Fly.io para o backend SIVE
# ==============================================================================
app = "sive-backend"
primary_region = "gru" # Sao Paulo, Brasil

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
