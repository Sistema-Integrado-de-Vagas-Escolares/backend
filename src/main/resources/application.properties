spring.application.name=sive-backend
server.port=8080

# Configuracoes de conexao JDBC com PostgreSQL
db.url=jdbc:postgresql://localhost:5432/sive_db
db.user=sive_user
db.password=sive_password
db.driver=org.postgresql.Driver

# Configuracoes de autenticacao de escolas (JWT/HMAC)
sive.auth.secret=${SIVE_AUTH_SECRET:sive-dev-secret-key-change-in-production-2026}
sive.auth.expiration-seconds=86400
