# fly.toml app configuration file generated for sive-backend on 2026-11-20T12:48:56-03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'sive-backend'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
